name: face_recognization
description: "Employee Face Recognition Attendance System"
publish_to: 'none'

version: 1.0.15

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera and Image Processing
  camera: ^0.10.5+9
  image: ^4.1.7
  image_picker: ^1.0.7



  # HTTP and API
  http: ^1.1.2
  dio: ^5.4.0

  # State Management
  provider: ^6.1.1
  get: ^4.6.6

  # UI Components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  url_launcher: ^6.2.2
  package_info_plus: ^8.0.0
  google_mlkit_face_detection: ^0.10.0

  # Payment
  razorpay_flutter: ^1.3.7

  # Charts
  fl_chart: ^0.66.0
  table_calendar: ^3.1.3
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.0.0
  local_auth: ^2.3.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # App icon generator
  flutter_launcher_icons: ^0.13.1
  # Native splash generator
  flutter_native_splash: ^2.4.4



# 🔥 THIS MUST BE AT ROOT LEVEL (NOT inside flutter:)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_cropped.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/splash_screen.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#FFFFFF"
    image: assets/icons/splash_screen.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins Regular 400.ttf
        - asset: assets/fonts/Poppins Medium 500.ttf
          weight: 500
        - asset: assets/fonts/Poppins SemiBold 600.ttf
          weight: 600
        - asset: assets/fonts/Poppins Bold 700.ttf
          weight: 700
